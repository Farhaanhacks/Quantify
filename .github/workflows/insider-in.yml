# NSE refuses the IP ranges the app runs on, so this ingest runs here instead:
# a GitHub Actions runner is a different network, and the app already prefers
# the Redis store over any live fetch. If NSE serves this runner, filings appear
# in the product with no change to the app.
#
# Run it manually first (Actions → this workflow → Run workflow). The log states
# NSE's HTTP status outright, which settles whether this route works.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KV_REST_API_URL    same value as in Vercel
#   KV_REST_API_TOKEN  same value as in Vercel

on:
  schedule:
    # 14:00 UTC = 19:30 IST, after the Indian market closes and filings land.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        required: false
        default: "7"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ingest
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          INSIDER_WINDOW_DAYS: ${{ github.event.inputs.days || '7' }}
        run: node scripts/ingest-insider-in.mjs
