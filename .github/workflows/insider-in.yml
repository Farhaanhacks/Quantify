name: Ingest Indian insider disclosures

# Self-contained ON PURPOSE. This used to call scripts/ingest-insider-in.mjs,
# which meant the job died with MODULE_NOT_FOUND whenever that second file was
# missing or misnamed — a failure that says nothing about NSE and wastes a run.
# The script is inlined below, so this workflow is the only file that has to
# exist and the only one to edit.
#
# Run it manually first (Actions -> this workflow -> Run workflow). The log
# states NSE's HTTP status outright, which settles whether this route works.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KV_REST_API_URL    same value as in Vercel
#   KV_REST_API_TOKEN  same value as in Vercel (the read-WRITE one)

on:
  schedule:
    # 14:00 UTC = 19:30 IST, after the Indian market closes and filings land.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull"
        required: false
        default: "7"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ingest
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          INSIDER_WINDOW_DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          cat > "$RUNNER_TEMP/ingest.mjs" <<'QUANTIFI_INGEST_EOF'
          #!/usr/bin/env node
          // Ingest Indian insider (SEBI PIT Reg 7) disclosures into Redis, from GitHub
          // Actions rather than from Vercel.
          //
          // Why this exists: NSE refuses requests from the IP ranges the app runs on, so
          // the in-app fetch cannot work no matter how it is written. A GitHub Actions
          // runner is a completely different network, and the app ALREADY prefers the
          // Redis store over any live fetch — so if NSE serves the runner, filings appear
          // in the product with no change to the app at all.
          //
          // Whether NSE serves that runner is not something anyone can reason their way
          // to. This script prints the exact HTTP status of every attempt, so the first
          // workflow run answers it outright.
          //
          // Writes the same keys the app reads:
          //   insider:in:<SYMBOL>   JSON array of disclosures, newest first, capped
          //   insider:in:_meta      { lastRun, symbols, rows, source }

          // Fallback universe, used only if NSE's own equity list cannot be fetched.
          // A hand-kept list is always out of date the moment a company lists — Lenskart
          // was missing from the app for exactly that reason — so this is the safety net,
          // not the source.
          const FALLBACK_SYMBOLS = [
            "ADANIENT", "ADANIPORTS", "APOLLOHOSP", "ASIANPAINT", "AXISBANK", "BAJAJ-AUTO",
            "BAJAJFINSV", "BAJFINANCE", "BHARTIARTL", "BPCL", "BRITANNIA", "CIPLA",
            "COALINDIA", "DABUR", "DIVISLAB", "DRREDDY", "EICHERMOT", "GRASIM", "HCLTECH",
            "HDFCBANK", "HDFCLIFE", "HINDALCO", "HINDUNILVR", "ICICIBANK", "INDUSINDBK",
            "INFY", "IOC", "ITC", "JSWSTEEL", "KOTAKBANK", "LENSKART", "LT", "LTIM", "M&M",
            "MARUTI", "NESTLEIND", "NTPC", "ONGC", "PERSISTENT", "POWERGRID", "RELIANCE",
            "SBILIFE", "SBIN", "SHREECEM", "SIEMENS", "SUNPHARMA", "TATACONSUM",
            "TATAMOTORS", "TATAPOWER", "TATASTEEL", "TCS", "TECHM", "TITAN", "TRENT",
            "ULTRACEMCO", "WIPRO", "ZOMATO",
          ];

          // How many symbols to ask about at once. NSE has just started serving us; this
          // stays low deliberately, because losing that access costs far more than the
          // job finishing a few minutes sooner.
          const CONCURRENCY = 4;

          /** [symbol, company name] from NSE's archive, for diagnosing a wrong symbol. */
          let archiveNames = [];

          const KV_URL = process.env.KV_REST_API_URL;
          const KV_TOKEN = process.env.KV_REST_API_TOKEN;
          const MAX_PER_SYMBOL = 40; // must match src/lib/insiderStore.ts
          const UA =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

          const die = (msg) => {
            console.error(`✗ ${msg}`);
            process.exit(1);
          };
          if (!KV_URL || !KV_TOKEN) die("KV_REST_API_URL / KV_REST_API_TOKEN are not set.");

          // ── Upstash REST ────────────────────────────────────────────────────────────
          async function kv(args) {
            const r = await fetch(KV_URL, {
              method: "POST",
              headers: { Authorization: `Bearer ${KV_TOKEN}`, "Content-Type": "application/json" },
              body: JSON.stringify(args),
            });
            if (!r.ok) throw new Error(`KV ${r.status}: ${(await r.text()).slice(0, 120)}`);
            return (await r.json())?.result ?? null;
          }

          // ── NSE ─────────────────────────────────────────────────────────────────────
          // NSE will not serve its API until its own pages have set cookies, so we keep a
          // jar by hand rather than pulling in a dependency.
          let jar = "";
          function remember(res) {
            const raw = res.headers.getSetCookie?.() ?? [];
            const pairs = raw.map((c) => c.split(";")[0]).filter(Boolean);
            if (!pairs.length) return;
            const map = new Map(jar ? jar.split("; ").map((p) => [p.split("=")[0], p]) : []);
            for (const p of pairs) map.set(p.split("=")[0], p);
            jar = [...map.values()].join("; ");
          }

          async function nseGet(url, accept = "application/json, text/plain, */*") {
            const res = await fetch(url, {
              headers: {
                "User-Agent": UA,
                Accept: accept,
                "Accept-Language": "en-US,en;q=0.9",
                Referer: "https://www.nseindia.com/companies-listing/corporate-filings-insider-trading",
                ...(jar ? { Cookie: jar } : {}),
              },
              signal: AbortSignal.timeout(12000),
              redirect: "follow",
            });
            remember(res);
            const text = await res.text().catch(() => "");
            let json = null;
            try {
              json = JSON.parse(text);
            } catch {
              /* not JSON — a block page, most likely */
            }
            return { status: res.status, json, text };
          }

          const dd = (d) =>
            `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`;
          const ago = (days) => new Date(Date.now() - days * 864e5);

          function normDate(s) {
            const t = Date.parse(s);
            if (isFinite(t)) return new Date(t).toISOString().slice(0, 10);
            const m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
            return m ? `${m[1]}-${m[2]}-${m[3]}` : String(s).slice(0, 10);
          }
          const str = (v) => (typeof v === "string" ? v.trim() : typeof v === "number" ? String(v) : "");

          // Mirrors pitRowToDisclosure in src/lib/insiderIndiaNSE.ts — including the id
          // format, so rows ingested here dedupe against anything the app stored.
          function toDisclosure(row) {
            if (!row || typeof row !== "object") return null;
            const sym = str(row.symbol);
            if (!sym) return null;
            const acq = str(row.acqName);
            const cat = str(row.personCategory);
            const tx = str(row.tdpTransactionType) || str(row.acqMode);
            const secType = str(row.secType) || "shares";
            const secAcq = str(row.secAcq);
            const secVal = str(row.secVal);
            const date = normDate(str(row.date) || str(row.anexDate) || str(row.acqfromDt) || str(row.besdate));

            const secValNum = Number(String(secVal).replace(/[^0-9.]/g, ""));
            const hasValue = Number.isFinite(secValNum) && secValNum > 0;
            const valPart = hasValue
              ? `₹${secValNum.toLocaleString("en-IN")}`
              : secAcq
                ? "no cash consideration"
                : "";
            const parts = [acq, cat, tx, secAcq ? `${secAcq} ${secType}` : "", valPart].filter(Boolean);
            const pdf = [str(row.attchmntFile), str(row.attachmentFile), str(row.attachment)].find(
              (u) => u && /^https?:\/\/\S+\.pdf(\?|$)/i.test(u)
            );
            const xbrl = str(row.xbrl);
            const url = pdf || (/^https?:\/\//.test(xbrl) ? xbrl : undefined);

            return {
              symbol: sym,
              disc: {
                id: `nse-${sym}-${date}-${acq.slice(0, 10)}-${secAcq}-${tx}`.replace(/\s+/g, ""),
                ticker: `${sym}.NS`,
                company: str(row.company) || sym,
                headline: parts.join(" · ") || "Insider / SAST disclosure",
                category: cat || "Insider Trading (PIT Reg 7)",
                date,
                url,
                person: acq || undefined,
                action: tx || undefined,
                sharesText: secAcq ? `${secAcq} ${secType}` : undefined,
                valueText: valPart || undefined,
              },
            };
          }

          /**
           * Pull the filing rows out of whatever NSE returned.
           *
           * `json.data` is where its insider feed puts them, but that was an assumption
           * carried from code that had never once reached NSE — every attempt had been
           * blocked before it got an answer. So this also accepts a bare top-level array,
           * and falls back to the largest array of objects anywhere in the payload. If
           * NSE names the key differently, the ingest still works instead of reporting a
           * confident zero.
           */
          function extractRows(json) {
            if (!json) return [];
            if (Array.isArray(json)) return json;
            if (Array.isArray(json.data)) return json.data;
            if (typeof json !== "object") return [];
            let best = [];
            for (const v of Object.values(json)) {
              if (Array.isArray(v) && v.length > best.length && v.every((x) => x && typeof x === "object")) {
                best = v;
              }
            }
            return best;
          }

          /**
           * Every symbol listed on NSE, from NSE's own equity list.
           *
           * This is the difference between a heatmap of companies someone once typed out
           * and the actual market. Falls back to the built-in list if the archive cannot
           * be reached, so a bad fetch degrades rather than empties the run.
           */
          async function loadSymbols() {
            try {
              const res = await nseGet(
                "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv",
                "text/csv,*/*"
              );
              if (res.status === 200 && res.text.includes(",")) {
                const lines = res.text.trim().split("\n").slice(1); // drop the header
                // Keep the company names alongside the symbols. When a symbol returns
                // nothing while thousands of others answer, the name is what identifies
                // the right one.
                archiveNames = lines
                  .map((l) => {
                    const cols = l.split(",");
                    return [cols[0]?.trim().toUpperCase() ?? "", cols[1]?.trim() ?? ""];
                  })
                  .filter(([sy]) => sy);
                const syms = archiveNames
                  .map(([sy]) => sy)
                  .filter((s) => /^[A-Z0-9&\-]{1,20}$/.test(s));
                if (syms.length > 100) {
                  console.log(`   symbol list: ${syms.length} from NSE's equity archive`);
                  return [...new Set(syms)];
                }
              }
              console.log(`   symbol list: archive unusable (HTTP ${res.status}), using built-in list`);
            } catch (e) {
              console.log(`   symbol list: archive fetch failed (${String(e).slice(0, 80)}), using built-in list`);
            }
            return FALLBACK_SYMBOLS;
          }

          /** Run `worker` over `items`, `limit` at a time. */
          async function pooled(items, limit, worker) {
            let i = 0;
            const runners = Array.from({ length: Math.min(limit, items.length) }, async () => {
              while (i < items.length) {
                const idx = i++;
                await worker(items[idx], idx);
              }
            });
            await Promise.all(runners);
          }

          async function main() {
            const days = Number(process.env.INSIDER_WINDOW_DAYS) || 7;
            console.log(`→ Warming up on nseindia.com …`);
            const home = await nseGet("https://www.nseindia.com/", "text/html,application/xhtml+xml");
            console.log(`   home: HTTP ${home.status}, ${home.text.length} bytes, cookies: ${jar ? "yes" : "none"}`);
            if (home.status !== 200) {
              console.log(`   body: ${home.text.slice(0, 200).replace(/\s+/g, " ")}`);
              die(
                `NSE refused this runner's IP (HTTP ${home.status}). GitHub's network is blocked too — a vendor feed is the remaining option.`
              );
            }

            // Then the filings page itself. NSE scopes some of its cookies to the section
            // you are browsing, and its APIs hand back an empty payload — not an error —
            // when called with only the homepage's cookies. A 200 carrying no rows is
            // exactly that symptom, so this visit is the first thing to try.
            const page = await nseGet(
              "https://www.nseindia.com/companies-listing/corporate-filings-insider-trading",
              "text/html,application/xhtml+xml"
            );
            console.log(`   filings page: HTTP ${page.status}, ${page.text.length} bytes`);

            // Wide window first; NSE returns empty for over-large ranges, so fall back.
            const base = "https://www.nseindia.com/api/corporates-pit?index=equities";
            const variants = [
              { q: `${days}d`, url: `${base}&from_date=${dd(ago(days))}&to_date=${dd(new Date())}` },
              { q: "3d", url: `${base}&from_date=${dd(ago(3))}&to_date=${dd(new Date())}` },
              { q: "1d", url: `${base}&from_date=${dd(ago(1))}&to_date=${dd(new Date())}` },
              { q: "latest", url: base },
            ];

            let rows = [];
            let wonWith = null;
            for (const v of variants) {
              const res = await nseGet(v.url);
              const data = extractRows(res.json);
              console.log(`   pit[${v.q}]: HTTP ${res.status}, ${data.length} rows`);
              // Show the body whenever it did not yield rows — including on a 200.
              //
              // The first live run returned "HTTP 200, 0 rows" and printed nothing else,
              // because this only logged on a non-200. That hid the one thing worth
              // knowing: a 200 carrying no rows means NSE answered us, so the payload is
              // either shaped differently than assumed or the query is wrong. Neither can
              // be diagnosed without seeing it.
              if (!data.length) {
                const keys = res.json && typeof res.json === "object" ? Object.keys(res.json) : [];
                console.log(`   → top-level keys: ${keys.length ? keys.join(", ") : "(not JSON)"}`);
                console.log(`   → body[0:400]: ${res.text.slice(0, 400).replace(/\s+/g, " ")}`);
              }
              if (data.length) {
                rows = data;
                wonWith = v.q;
                break;
              }
            }

            // Per-symbol, which is the call NSE's own page actually makes.
            //
            // The market-wide date query answers cleanly and says there is nothing:
            // {"acqNameList":[],"data":[]}. That is a well-formed response, not a block
            // and not a shape we misread — `data` is the right key. NSE simply does not
            // serve the whole market from that endpoint the way this assumed. Asking per
            // symbol is what the filings page does, so that is what we do.
            if (!rows.length) {
              // Which per-symbol form to use, decided by measurement rather than assumed.
              //
              // The no-date call returned filings for 51 companies but nothing for
              // Lenskart, whose most recent filing is a month old — so NSE's default
              // window is evidently short, and any company without very recent activity
              // reads as empty. A dated call should reach further back, but dates are
              // also what made the market-wide query return nothing, so neither form can
              // be taken on trust. Ask a company known to have a year of filings both
              // ways, and use whichever actually answers.
              const probeSym = process.env.INSIDER_PROBE_SYMBOL || "LENSKART";
              const yearAgo = dd(ago(365));
              const todayStr = dd(new Date());
              const forms = [
                {
                  name: "dated(1y)",
                  make: (x) => `${base}&symbol=${encodeURIComponent(x)}&from_date=${yearAgo}&to_date=${todayStr}`,
                },
                { name: "no-date", make: (x) => `${base}&symbol=${encodeURIComponent(x)}` },
              ];
              let form = forms[1];
              let probeHadRows = false;
              console.log(`→ Probing query forms on ${probeSym} …`);
              for (const f of forms) {
                const r = await nseGet(f.make(probeSym));
                const n = extractRows(r.json).length;
                console.log(`   ${f.name}: HTTP ${r.status}, ${n} rows`);
                if (n > 0) {
                  form = f;
                  probeHadRows = true;
                  break;
                }
              }
              console.log(`   using ${form.name}`);

              const symbols = await loadSymbols();
              // The probe found nothing while thousands of other symbols answered, so the
              // symbol itself is wrong, not the query. The archive carries company NAMES
              // beside symbols, so it can say what NSE actually calls this company.
              if (!probeHadRows) {
                const needle = probeSym.slice(0, 5).toUpperCase();
                const guesses = archiveNames.filter(([, name]) => name.toUpperCase().includes(needle)).slice(0, 5);
                console.log(
                  guesses.length
                    ? `   note: "${probeSym}" returned nothing. NSE lists: ${guesses.map(([sy, n]) => `${sy} (${n})`).join("; ")}`
                    : `   note: "${probeSym}" returned nothing, and no NSE company name contains "${needle}".`
                );
              }
              console.log(`→ Market-wide came back empty. Asking per symbol across ${symbols.length} companies …`);
              let hit = 0;
              let done = 0;
              let shown = 0;
              let failed = 0;
              await pooled(symbols, CONCURRENCY, async (sym) => {
                // Per-symbol isolation. A single slow response used to abort the whole
                // job: one timeout at symbol 2250 of 2401 threw away 26,350 rows already
                // fetched. Nothing about one company should cost the other two thousand.
                try {
                  const res = await nseGet(form.make(sym));
                  const data = extractRows(res.json);
                  if (data.length) {
                    hit++;
                    rows.push(...data);
                  } else if (hit === 0 && shown < 3) {
                    // Show the first few misses in full so a wrong query is visible at
                    // once rather than after every symbol silently returns nothing.
                    shown++;
                    console.log(`   ${sym}: HTTP ${res.status} — ${res.text.slice(0, 140).replace(/\s+/g, " ")}`);
                  }
                } catch (e) {
                  failed++;
                  if (failed <= 3) console.log(`   ${sym}: ${String(e).slice(0, 90)}`);
                }
                done++;
                if (done % 250 === 0) console.log(`   … ${done}/${symbols.length} checked, ${rows.length} rows so far`);
              });
              if (failed) console.log(`   ${failed} symbol(s) errored and were skipped`);
              console.log(`→ per-symbol: ${hit}/${symbols.length} companies had filings, ${rows.length} rows total`);
              if (rows.length) wonWith = "per-symbol";
            }

            if (!rows.length) {
              die("NSE answered every query but returned no filings. Nothing written.");
            }

            const bySymbol = new Map();
            for (const row of rows) {
              const parsed = toDisclosure(row);
              if (!parsed) continue;
              const list = bySymbol.get(parsed.symbol) ?? [];
              list.push(parsed.disc);
              bySymbol.set(parsed.symbol, list);
            }

            console.log(`→ ${rows.length} filings across ${bySymbol.size} companies (window ${wonWith})`);

            let written = 0;
            for (const [symbol, fresh] of bySymbol) {
              const key = `insider:in:${symbol.toUpperCase()}`;
              // Merge with whatever is stored so history accumulates across runs, exactly
              // as mergeStoredInsider does in the app.
              let existing = [];
              try {
                const raw = await kv(["GET", key]);
                if (raw) existing = JSON.parse(raw) ?? [];
              } catch {
                /* treat an unreadable key as empty rather than losing the run */
              }
              const seen = new Set(existing.map((d) => d.id));
              const combined = [...fresh.filter((d) => !seen.has(d.id)), ...existing]
                .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
                .slice(0, MAX_PER_SYMBOL);
              await kv(["SET", key, JSON.stringify(combined)]);
              written++;
            }

            await kv([
              "SET",
              "insider:in:_meta",
              JSON.stringify({
                lastRun: new Date().toISOString(),
                symbols: written,
                rows: rows.length,
                source: "github-actions-nse",
              }),
            ]);

            console.log(`✓ Wrote ${written} symbols to Redis. The app will serve these immediately.`);
          }

          main().catch((e) => die(String(e)));

          QUANTIFI_INGEST_EOF
          node "$RUNNER_TEMP/ingest.mjs"

          QUANTIFI_INGEST_EOF
          node "$RUNNER_TEMP/ingest.mjs"
